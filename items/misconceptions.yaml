# Misconception catalogue.
#
# Each entry is a SPECIFIC, reproducible error — not a topic and not "didn't
# understand". The test for inclusion: can you write a function that applies
# this error to a problem and produces a definite wrong answer? If not, it is
# too vague to belong here.
#
# `eedi_id` is reserved for mapping onto Eedi's open Misconception Graph
# (8,000+ misconceptions from ~200m responses, CC BY 4.0). All null for now —
# see docs/DESIGN.md §2 for the licence checklist that blocks that import.
# Once mapped, Eedi's id becomes the canonical key and ours becomes an alias.
#
# `skill` must exist in curriculum/skills.yaml. Enforced by generate.py.

misconceptions:

