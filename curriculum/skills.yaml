# GCSE Mathematics skill graph — Foundation tier
#
# Nodes are ATOMIC skills, finer-grained than spec statements. One spec
# statement (e.g. A4 "simplify and manipulate algebraic expressions") maps to
# several skills here, so skill -> spec_ref is many-to-one.
#
# spec_ref uses the DfE "Mathematics GCSE subject content" reference letters
# (N/A/R/G/P/S), which AQA states are common to all exam boards. See
# curriculum/README.md — EVERY spec_ref IN THIS FILE IS UNVERIFIED best-effort
# and must be checked against the DfE document before it is relied on.
#
# spec_ref: null means the skill is assumed prior knowledge (KS2/KS3) and is
# not in the GCSE spec. Those are the `foundation` coverage bucket in
# docs/DESIGN.md §3.2 — always in scope, because forgotten KS2/KS3 number work
# is where the diagnostic finds the real damage.
#
# Invariants enforced by validate.py:
#   - acyclic
#   - every KS4 node reachable from at least one KS2/KS3 root
#   - no node has more than 4 direct prerequisites
#   - no duplicate ids, no dangling prereq references
#   - a foundation-tier skill never depends on a higher-only skill
#
# Fields:
#   id        stable, dot-separated, never renamed once live (it is a DB key)
#   title     student-facing
#   domain    number | algebra | ratio | geometry | probability | statistics
#   key_stage KS2 | KS3 | KS4
#   tier      foundation | higher   (Foundation content is a subset of Higher)
#   spec_ref  DfE reference, or null for pre-GCSE
#   prereqs   list of ids

